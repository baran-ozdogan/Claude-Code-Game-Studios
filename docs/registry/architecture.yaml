# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: scene_loading
    status: active
    api: "SceneManager.LoadSceneAsync(mode: Additive) + SceneManager.SetActiveScene + SceneManager.UnloadSceneAsync"
    not: "Addressables.LoadSceneAsync"     # explicitly rejected for scene loading specifically — see Alternative 2 in the ADR
    adr: docs/architecture/adr-0001-scene-transition-manager.md
    reason: "MVP's 3 fixed local scenes don't need Addressables catalog management; Addressables.LoadSceneAsync
      wraps the same underlying SceneManager additive/active-scene semantics anyway, so it wouldn't remove
      the RenderGraph multi-scene risk this ADR already has to address. Scoped to SCENE loading only — does
      not set a project-wide stance on Addressables for other asset types (ScriptableObjects, prefabs),
      which remains an open decision flagged in architecture-review-2026-08-05.md."
    referenced_by:
      - docs/architecture/adr-0001-scene-transition-manager.md
    added: 2026-08-05
    revised: ""

  - purpose: input_consumption
    status: active
    api: "Generated C# class (new PlayerControls()) + manual controls.Enable()/Disable() in OnEnable()/OnDisable()"
    not: "PlayerInput component with Send Messages"     # stringly-typed, not unit-testable without a live GameObject/message pump
    adr: docs/architecture/adr-0002-first-person-controller.md
    reason: "Matches engine-reference's documented recommended pattern for Unity 6.3's Input System package.
      Fully unit-testable in isolation (no live message pump needed), satisfying this project's
      dependency-injection/testability coding standard. Applies project-wide to any system reading
      the shared 'Gameplay' Input Actions map, not just the First-Person Controller."
    referenced_by:
      - docs/architecture/adr-0002-first-person-controller.md
    added: 2026-08-05
    revised: ""

  - purpose: scene_object_self_registration
    status: active
    api: "MonoBehaviour registers itself into a static Dictionary<key, self> in Awake() (present for the object's whole lifetime, not gated on active state), unregisters in OnDestroy() guarded by a reference check (only remove if dict[key] == this) before removing"
    not: "FindObjectsOfType/tag-based scene scan at call time; OnEnable/OnDisable-based registration when the lookup must be valid before Start() runs (e.g. for an editor/scene-load-time validator)"
    adr: docs/architecture/adr-0005-lighting-volume-state.md
    reason: "Rule-of-three pattern (TD-ADR finding, ADR-0005 review) — this project has now independently arrived at self-registering-MonoBehaviour-into-a-static-dictionary three times conceptually (this ADR's LightingTriggerZone/LightingVolumeState, the not-yet-written Interaction System's InteractableRegistry referenced across multiple GDDs, and implicitly similar patterns elsewhere). Registered as a reusable SHAPE, not tied to one interface: (1) registration hook is Awake() when any consumer needs the registry populated before Start() (e.g. a scene-load-time validator), OnEnable()/OnDisable() when the object is expected to be dynamically toggled at runtime and callers should stop dispatching to a disabled object; (2) unknown-key lookups return a documented safe default and never throw; (3) duplicate-key registration is caught at edit time (build-blocking validation), not silently overwritten at runtime; (4) unregistration in OnDestroy()/OnDisable() MUST be reference-checked (only remove if the dictionary's current value for that key is still this instance) to avoid a reload-timing race deleting a newer registration. The future Interaction System ADR should follow this same shape for InteractableRegistry rather than inventing a fourth variant independently. **Extended by ADR-0008** (2026-08-05, TD-ADR finding): a new sub-variant — a SINGLE slot (not a Dictionary<key, self>) for a true singleton MonoBehaviour (PlayerController self-registering into FoundationCompositionRoot.MovementLock/PlayerTeleport). Same four rules apply, with rule 4's reference-check applying to a plain property comparison (ReferenceEquals) instead of a dictionary entry, and OnEnable/OnDisable was chosen over Awake/OnDestroy specifically to get symmetric teardown safety (an Awake/OnDestroy-only registration would still leave the composition-root reference unsafe across a disable-without-destroy cycle, e.g. PlayMode test teardown) — this was the BLOCKING finding that replaced ADR-0008's originally-drafted raw property push."
    referenced_by:
      - docs/architecture/adr-0005-lighting-volume-state.md
      - docs/architecture/adr-0007-interaction-system.md   # InteractableRegistry adopts the OnEnable/OnDisable branch this entry documents — dynamically-toggled objects (carry items SetActive(false) on pickup)
      - docs/architecture/adr-0008-elevator-floor-access.md   # PlayerController self-registers into FoundationCompositionRoot -- new single-slot-singleton sub-variant, not a collection-based registry
    added: 2026-08-05
    revised: "2026-08-05 (ADR-0007's InteractableRegistry confirmed as the pattern's second real use case, using the OnEnable/OnDisable branch rather than Awake/OnDestroy; ADR-0008 adds a third use case and a new single-slot-singleton sub-variant)"

  - purpose: foundation_composition_root
    status: active
    api: "FoundationCompositionRoot.Wire(), a single [RuntimeInitializeOnLoadMethod(BeforeSceneLoad)] static method that assigns ALL cross-static Foundation-layer wiring (injectable-interface-plus-null-object properties like SessionState.LightingQuery, AdaptiveAudioState.TransitionSource, etc.) in one deterministic place"
    not: "Hand-patching whichever earlier ADR happened to define the interface first, once per new consumer (the pattern ADR-0003→ADR-0004→ADR-0005 followed for ILightingVolumeQuery before this entry existed — do not repeat it)"
    adr: docs/architecture/adr-0006-adaptive-audio.md
    reason: "TD-ADR finding (ADR-0006 review): by the time a third consumer (AdaptiveAudioState.LightingQuery) plus a structurally identical but unrelated assignment (AdaptiveAudioState.TransitionSource) needed wiring, repeatedly amending ADR-0005's bootstrap no longer scaled and incorrectly implied Lighting/Volume 'owns' wiring for systems unrelated to lighting. This class does not belong to any single system's ADR — it is specified in ADR-0006 because that is where the problem became undeniable. Every future ADR that introduces a new injectable-interface-plus-null-object cross-static dependency (following the api_decisions.scene_object_self_registration or ILightingVolumeQuery precedent) should add its assignment here and list itself in this entry's referenced_by, rather than amending ADR-0005 or ADR-0006 again. **Extended by ADR-0007** (2026-08-05) to cover a new sub-case: wiring a static-owned resource (FlaggedObjectRegistry) into a scene MonoBehaviour consumer (PlayerController) that itself uses constructor/Inspector injection — the composition root exposes a static property, and the MonoBehaviour adopts it in Awake() only if its own injected field is still unset, preserving that consumer's original DI/testability rather than forcing a single mechanism. **Extended by ADR-0008** (2026-08-05, TD-ADR finding) to cover the REVERSE direction: a static consumer (ElevatorState) needing a reference INTO a not-yet-existing MonoBehaviour singleton (PlayerController) — the exact 'two-way dependency' case this entry's ADR-0006 origin flagged as unsolved. A raw property push from PlayerController.Awake() was drafted first and REJECTED (BLOCKING, TD-ADR review): an interface-typed static reference to a destroyed UnityEngine.Object does not safely degrade to null (Unity's fake-null override does not engage through an interface reference), so a destroyed-and-not-torn-down PlayerController would throw MissingReferenceException on next access. Fixed by reusing api_decisions.scene_object_self_registration's convention instead (RegisterPlayer/UnregisterPlayer, called from PlayerController.OnEnable/OnDisable, reference-checked) — this is now the composition root's SECOND sub-case, alongside ADR-0007's adopt-if-unset: static-implemented dependencies are pull-wired in Wire(); MonoBehaviour-implemented dependencies self-register via OnEnable/OnDisable."
    referenced_by:
      - docs/architecture/adr-0003-session-state.md
      - docs/architecture/adr-0004-narrative-state.md
      - docs/architecture/adr-0005-lighting-volume-state.md
      - docs/architecture/adr-0006-adaptive-audio.md
      - docs/architecture/adr-0007-interaction-system.md
      - docs/architecture/adr-0002-first-person-controller.md   # consumer side — PlayerController.Awake() adopt-if-unset fallback; PlayerController.OnEnable/OnDisable self-registration (ADR-0008)
      - docs/architecture/adr-0008-elevator-floor-access.md   # adds TransitionManager/MovementLock/PlayerTeleport properties + the self-registration sub-case
    added: 2026-08-05
    revised: "2026-08-05 (ADR-0007 extended the pattern to cover MonoBehaviour consumers with pre-existing DI, via a static-property + adopt-if-unset sub-case; ADR-0008 extended it further with a self-registration sub-case for the reverse two-way-dependency direction, replacing a rejected raw-push alternative)"

