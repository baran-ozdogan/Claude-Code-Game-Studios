# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: session_scoped_state_static_facade
    status: active
    pattern: direct_call
    producer: "N/A — project-wide pattern, not owned by one system"
    consumers:
      - gece-oturum-durumu         # in-place reset since ADR-0015 (exposed events + persistent subscribers)
      - isik-volume-durum-sistemi  # in-place reset since ADR-0015 (exposed events + persistent subscribers)
      - anlati-durum-ipucu-takibi  # in-place reset since ADR-0015 (constructor-subscribes to an in-place source)
      - adaptif-ses-sistemi        # state/event slice only (HeldSessionAlreadyPlayed) — system also owns MonoBehaviour-driven audio playback outside this pattern
      - diyalog-anlati-icerigi     # state/event slice only (UsedCallbackIds) — system also owns MonoBehaviour-driven UI Toolkit playback outside this pattern
      - asansor-kat-erisim-sistemi # state/event slice only (ElevatorSystem ride state) — driven by per-floor MonoBehaviours, in-place reset required (ADR-0011)
      - gorev-tasima-dongusu       # carry/round state (ADR-0013) — the pattern's first FEATURE-layer consumer; in-place reset (event-exposing facade)
      - interactableregistry
      # seviye-sahne-gecisi REMOVED (ADR-0008, 2026-08-06) — that system is
      # a MonoBehaviour in a persistent scene, not a plain static-facade
      # consumer of this pattern; see ADR-0001's own inline correction note.
    adr: docs/architecture/adr-0001-in-memory-static-service-pattern.md
    signal_signature: "N/A — see ADR for interface+static-facade shape; reset centralized in FoundationBootstrap.ResetAll(), [RuntimeInitializeOnLoadMethod(SubsystemRegistration)], ordered by Foundation dependency graph"
    referenced_by:
      - docs/architecture/adr-0001-in-memory-static-service-pattern.md
      - docs/architecture/adr-0012-dialogue-callback-selection-timing.md   # diyalog-anlati-icerigi's own UsedCallbackIds slice, already anticipated as a consumer above
    added: 2026-08-05
    revised: "2026-08-06 — removed seviye-sahne-gecisi from consumers (ADR-0008)"

  - contract: live_monobehaviour_state_static_accessor
    status: active
    pattern: direct_call
    producer: "N/A — per-consumer pattern, not owned by one system (distinct from session_scoped_state_static_facade above: this is for a live MonoBehaviour's own state/members, not FoundationBootstrap-reset pure C# state)"
    consumers:
      - uiroot
      - diyalog-anlati-icerigi   # DialogueSceneController reads UIRoot.Instance.Root for #dialogue-subtitle (ADR-0012)
      - initial-spawn-anchor     # depot-scene boot-spawn contract (ADR-0015): exactly one per initial level scene, build-verified; Awake-set Instance + duplicate guard
    adr: docs/architecture/adr-0010-interaction-state-machine.md
    signal_signature: "N/A — a plain `public static T Instance { get; private set; }` set in Awake() with a duplicate-instance guard (Destroy(gameObject) + Debug.LogError on a second instance), read directly by other MonoBehaviours (e.g. InteractionController.OnEnable() reading UIRoot.Instance.Root). Same shape as PlayerStateProvider (ADR-0003)/SceneTransitionManager (ADR-0008)/AdaptifSesController (ADR-0009), but those are registered as api_decisions execution-context entries since they also own FoundationBootstrap-adjacent state; UIRoot has no such state, so it is registered here as a pure lookup-contract instead."
    referenced_by:
      - docs/architecture/adr-0010-interaction-state-machine.md
      - docs/architecture/adr-0012-dialogue-callback-selection-timing.md
    added: 2026-08-07
    revised: ""

