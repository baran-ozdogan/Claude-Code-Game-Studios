# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: scene_transition_events
    status: active
    pattern: signal
    producer: scene-transition-manager
    consumers:
      - elevator-floor-access      # ADR-0008, 2026-08-05: calls RequestSoftTransition via FoundationCompositionRoot.TransitionManager (pull-wired, SceneTransitionManager is itself static — no timing concern), does not subscribe
      - cutscene-narrative         # future ADR: calls PreloadHardCut/RequestHardCut, does not subscribe
      - adaptive-audio             # ADR-0006, 2026-08-05: subscribes via the narrower ISceneTransitionQuery (see below), filters type==Hard for HARD CUT Sting
    adr: docs/architecture/adr-0001-scene-transition-manager.md
    signal_signature: "OnTransitionStateChanged(TransitionState newState, TransitionType type) — full command surface is ISceneTransitionManager. ADR-0006 amendment added a narrower ISceneTransitionQuery { event OnTransitionStateChanged; bool GetCurrentHardCutAbrupt(); } for read-only consumers (adaptive-audio) that never call Preload/Request methods — same concrete SceneTransitionManager implements both interfaces."
    referenced_by:
      - docs/architecture/adr-0001-scene-transition-manager.md
      - docs/architecture/adr-0006-adaptive-audio.md
      - docs/architecture/adr-0008-elevator-floor-access.md
    added: 2026-08-05
    revised: "2026-08-05 (added ISceneTransitionQuery narrowing per ADR-0006; elevator-floor-access is now a real consumer, per ADR-0008)"

  - contract: sfx_mixer_group
    status: active
    pattern: shared_resource
    producer: adaptive-audio
    consumers:
      - carry-loop    # TBD — ADR not yet written; this entry BINDS that future ADR to route pickup/delivery/jostle sounds here
    adr: docs/architecture/adr-0006-adaptive-audio.md
    signal_signature: "Dedicated 'SFX' AudioMixer group, no dynamic processing, explicitly no ducking (project-wide 'no build-up/riser/crescendo' mixing philosophy) — future Carry Loop ADR routes its AudioSources' outputAudioMixerGroup here, does not define its own group"
    referenced_by:
      - docs/architecture/adr-0006-adaptive-audio.md
    added: 2026-08-05
    revised: ""

  - contract: movement_lock_contract
    status: active
    pattern: direct_call
    producer: first-person-controller
    consumers:
      - elevator-floor-access      # ADR-0008, 2026-08-05: RequestMovementLock(ElevatorLockToken.Instance, MoveOnly)/Release, via FoundationCompositionRoot.MovementLock (self-registered by PlayerController, not a direct reference)
      - cutscene-narrative         # future ADR: RequestMovementLock(this, Full)/Release before HARD CUT
      - interaction-system         # ADR-0007, 2026-08-05: RequestMovementLock(this, MoveOnly)/Release during Hold gestures, pre-checked via IsLocked (never a rejection path)
    adr: docs/architecture/adr-0002-first-person-controller.md
    signal_signature: "RequestMovementLock(object requester, MovementLockScope scope = Full) / ReleaseMovementLock(object requester) — Dictionary<object, MovementLockScope>-backed, most-restrictive-scope-wins"
    referenced_by:
      - docs/architecture/adr-0002-first-person-controller.md
      - docs/architecture/adr-0007-interaction-system.md
      - docs/architecture/adr-0008-elevator-floor-access.md
    added: 2026-08-05
    revised: "2026-08-05 (interaction-system is now a real consumer, per ADR-0007; elevator-floor-access is now a real consumer, per ADR-0008, reached via FoundationCompositionRoot.MovementLock rather than a direct PlayerController reference)"

  - contract: flagged_object_registry
    status: active
    pattern: direct_call
    producer: interaction-system   # RESOLVED by ADR-0007, 2026-08-05 — was TBD
    consumers:
      - first-person-controller    # calls NearestFlaggedDistance(position) for Formula 2's approach-slow taper
    adr: docs/architecture/adr-0007-interaction-system.md   # producer ADR — implements via InteractableRegistryAdapter; see also adr-0002 (consumer)
    signal_signature: "float NearestFlaggedDistance(Vector3 position) — IFlaggedObjectRegistry, returns float.PositiveInfinity if empty/unset. ADR-0007's InteractableRegistry stores (IInteractable,Transform) pairs — position lives in the registry, not the IInteractable contract. Wired via FoundationCompositionRoot.FlaggedObjectRegistry; PlayerController.Awake() adopts it only if its own injected field is still null (ADR-0002's DI/testability preserved)."
    referenced_by:
      - docs/architecture/adr-0002-first-person-controller.md
      - docs/architecture/adr-0007-interaction-system.md
    added: 2026-08-05
    revised: "2026-08-05 (producer resolved by ADR-0007 — was TBD; wiring closed via FoundationCompositionRoot extension)"

  - contract: player_state_query
    status: active
    pattern: shared_resource
    producer: first-person-controller
    consumers:
      - interaction-system         # ADR-0007, 2026-08-05: EyeCamera (SphereCast source), IsLocked (Hold pre-check)
      - elevator-floor-access      # ADR-0008, 2026-08-05: does NOT use IPlayerState directly -- reaches PlayerController only via the narrower ISceneTransitionAware/IPlayerTeleport slices, through FoundationCompositionRoot self-registration (see player_teleport contract below and movement_lock_contract above)
      - carry-loop                 # future ADR: SetCarrying, IsCarrying
      - adaptive-audio             # future ADR: Velocity via PlayFootstep
      - lighting-volume            # future ADR: reads PlayerMaxSpeed constant
      - cutscene-narrative         # future ADR
    adr: docs/architecture/adr-0002-first-person-controller.md
    signal_signature: "IPlayerState { EyeCamera, Velocity, IsGrounded, MovementLocked, IsCarrying, IsLocked, HoldsLock(requester), Interact, MovementLockChanged }"
    referenced_by:
      - docs/architecture/adr-0002-first-person-controller.md
      - docs/architecture/adr-0007-interaction-system.md
    added: 2026-08-05
    revised: "2026-08-05 (clarified elevator-floor-access does not consume this contract directly, per ADR-0008 -- see player_teleport/movement_lock_contract instead)"

  - contract: lighting_shift_state
    status: active
    pattern: signal
    producer: lighting-volume-state   # RESOLVED by ADR-0005, 2026-08-05 — was TBD
    consumers:
      - session-state               # subscribes via SessionState.LightingQuery (ILightingVolumeQuery), own null-object default
      - narrative-state              # subscribes via NarrativeState.LightingQuery (SEPARATE property, own null-object default — added by ADR-0004, 2026-08-05)
      - adaptive-audio               # subscribes via AdaptiveAudioState.LightingQuery (SEPARATE property, own null-object default — added by ADR-0006, 2026-08-05)
    adr: docs/architecture/adr-0005-lighting-volume-state.md   # producer ADR — implements ILightingVolumeQuery via LightingVolumeQueryAdapter; see also adr-0003/adr-0004/adr-0006 (consumers)
    signal_signature: "ILightingVolumeQuery { event OnShiftStateChanged(string shiftId, ShiftState newState, Vector3 zoneCenter, float radius); bool IsShiftPersistent(string shiftId); } — WIRING MOVED (ADR-0006, 2026-08-05): a single shared LightingVolumeQueryAdapter instance is assigned to SessionState.LightingQuery, NarrativeState.LightingQuery, AND AdaptiveAudioState.LightingQuery from FoundationCompositionRoot.Wire() (see api_decisions.foundation_composition_root below) — no longer from ADR-0005's own bootstrap directly. All three properties are independent; assigning one does not satisfy the others."
    referenced_by:
      - docs/architecture/adr-0003-session-state.md
      - docs/architecture/adr-0004-narrative-state.md
      - docs/architecture/adr-0005-lighting-volume-state.md
      - docs/architecture/adr-0006-adaptive-audio.md
    added: 2026-08-05
    revised: "2026-08-05 (adaptive-audio added as 3rd consumer per ADR-0006; wiring moved from ADR-0005's bootstrap to FoundationCompositionRoot)"

  - contract: narrative_query_contract
    status: active
    pattern: direct_call
    producer: narrative-state
    consumers:
      - dialogue-content   # TBD — ADR not yet written; this entry BINDS that future ADR to consume this contract
    adr: docs/architecture/adr-0004-narrative-state.md
    signal_signature: "MarkClueKnown(string clueId) [idempotent] / IsClueKnown(string clueId) [never throws, false for unknown] / GetKnownClueIds() [IReadOnlyCollection<string>, empty-but-never-null] / event OnClueKnown(string clueId) [fires once per Unknown→Known transition; late subscribers must reconcile via polling, events are not replayed]"
    referenced_by:
      - docs/architecture/adr-0004-narrative-state.md
    added: 2026-08-05
    revised: ""

  - contract: player_teleport
    status: active
    pattern: direct_call
    producer: first-person-controller
    consumers:
      - elevator-floor-access      # ADR-0008, 2026-08-05: Teleport(destination CabinInteriorAnchor.position/rotation) on RequestSoftTransition's onComplete
      - cutscene-narrative         # future ADR: likely HARD CUT spawn-point placement, not yet authored
    adr: docs/architecture/adr-0002-first-person-controller.md   # interface defined here (amendment, ADR-0008); PlayerController is the sole implementer
    signal_signature: "IPlayerTeleport { void Teleport(Vector3 position, Quaternion rotation); } — deliberately SEPARATE from ISceneTransitionAware (movement_lock_contract) per Interface Segregation: a MovementLock holder must not automatically gain teleport authority. Disables CharacterController before the position write, resets vertical-velocity/grounded state, re-enables after."
    referenced_by:
      - docs/architecture/adr-0002-first-person-controller.md
      - docs/architecture/adr-0008-elevator-floor-access.md
    added: 2026-08-05
    revised: ""

