# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: session_scoped_state_persistence
    status: active
    api: "Plain C# class + interface + static facade property, reset centrally via FoundationBootstrap.ResetAll() ([RuntimeInitializeOnLoadMethod(SubsystemRegistration)], ordered by Foundation dependency graph)"
    not: "DontDestroyOnLoad singleton MonoBehaviour; ScriptableObject runtime-set/variable pattern; full third-party DI framework (VContainer/Zenject)"
    adr: docs/architecture/adr-0001-in-memory-static-service-pattern.md
    reason: "Closes 2 LP-FEASIBILITY findings (Domain Reload risk, DI/testability conflict with coding-standards.md) with the smallest change consistent with architecture.md's already-established static-service persistence principle; ScriptableObjects have their own equivalent Domain-Reload-style gotcha and would blur this project's clean config/state object split; a full DI framework is disproportionate to 5 Foundation services in a solo/small-team MVP (corrected from 6 — ADR-0008, 2026-08-06 — removed seviye-sahne-gecisi from this pattern)."
    referenced_by:
      - docs/architecture/adr-0001-in-memory-static-service-pattern.md
    added: 2026-08-05
    revised: ""

  - purpose: ui_rendering_framework
    status: active
    api: "UI Toolkit (UIDocument/VisualElement/USS) exclusively; one shared UIDocument for all UI elements, rooted in a dedicated persistent 'UI' scene loaded additively once at boot and never unloaded; per-frame/per-state visual updates driven by direct C# style.* writes, never USS transition/declarative animation, for elements with a GDD-locked timing contract"
    not: "UGUI/Canvas/TextMeshProUGUI (anywhere in the project, including future menus); IMGUI; DontDestroyOnLoad for the UI GameObject; per-element UIDocument split"
    adr: docs/architecture/adr-0002-ui-framework-ui-toolkit.md
    reason: "Matches Unity 6's own current-best-practice guidance with no countervailing cost on a greenfield project; single shared document is the correct categorization for one always-on non-modal HUD overlay with no independent navigation lifecycle (not 4 separate 'screens'); reuses the project's existing additive-scene-persistence pattern (see session_scoped_state_persistence) instead of introducing DontDestroyOnLoad as a second mechanism; C#-driven timing keeps GDD-locked animation contracts (e.g. strictly-linear Hold-fill progress) in reviewed gameplay code rather than an unreviewed .uss file."
    referenced_by:
      - docs/architecture/adr-0002-ui-framework-ui-toolkit.md
    added: 2026-08-05
    revised: ""

  - purpose: player_persistence_across_scene_swap
    status: active
    api: "Dedicated persistent 'Player' scene, loaded additively once at boot (same mechanism/timing family as the 'UI' scene from ADR-0002), never unloaded; SOFT transitions reposition the existing player Transform to the target scene's SoftTransitionAnchor rather than destroying/recreating the GameObject"
    not: "DontDestroyOnLoad for the player GameObject"
    adr: docs/architecture/adr-0003-player-state-and-movement-lock.md
    reason: "Third consistent application of this project's 'persistent scene, not DontDestroyOnLoad' pattern (state: ADR-0001, UI: ADR-0002, player: here); matches seviye-sahne-gecisi.md's own requirement that the player is repositioned, not recreated, on a SOFT transition; avoids a third independent persistence mechanism for the same underlying problem."
    referenced_by:
      - docs/architecture/adr-0003-player-state-and-movement-lock.md
    added: 2026-08-05
    revised: ""

  - purpose: isik_volume_rendering_mechanism
    status: active
    api: "Shared URP VolumeProfile asset + one local (isGlobal=false, blendDistance=0) Volume per ShiftZone, Volume.weight driven directly from script by ShiftProgress; each zone's own Light array color/intensity lerped in lockstep by the same value"
    not: "Custom ScriptableRendererFeature/RenderGraph pass; baked lightmap set switching"
    adr: docs/architecture/adr-0005-isik-volume-rendering-architecture.md
    reason: "Every value isik-volume-durum-sistemi.md needs (White Balance/Tint/Post Exposure/Saturation, Light color/intensity) is already achievable via standard, stable, pre-cutoff Volume/Light APIs — a custom RenderGraph pass would duplicate this for zero functional gain while introducing the project's single highest-risk engine domain; baked lightmap swapping can't animate smoothly through ShiftProgress and was already rejected in the GDD itself. Empirically validated for the single-zone case by prototypes/yankilar-volume-weight-spike/."
    referenced_by:
      - docs/architecture/adr-0005-isik-volume-rendering-architecture.md
    added: 2026-08-05
    revised: ""

  - purpose: session_round_counter_ownership
    status: active
    api: "CurrentRoundIndex/TotalRoundCount stored on Gece/Oturum Durumu (Foundation), written only by Görev/Taşıma Döngüsü (Feature) via a direct internal method call — GeceOturumDurumu.InternalInstance.SetRoundState(idx, total) — on every round transition; Adaptif Ses Sistemi reads them via a plain polled property, no event"
    not: "Storage remaining on Görev/Taşıma Döngüsü with Adaptif Ses reading upward across layers (the original violation); Gece/Oturum Durumu subscribing to a Görev/Taşıma-owned event to receive the write (would make a Foundation service depend on a Feature-layer event source — backwards regardless of data-flow direction)"
    adr: docs/architecture/adr-0006-session-state-service-and-round-counter-ownership.md
    reason: "Implements architecture.md Phase 1's Feature→Foundation relocation decision; a direct method call (Feature calling into Foundation's surface) keeps the dependency arrow pointing the architecturally allowed way, which a reverse event subscription would not, even though both move the same two integers."
    referenced_by:
      - docs/architecture/adr-0006-session-state-service-and-round-counter-ownership.md
      - docs/architecture/adr-0013-carry-loop-and-round-state.md   # the concrete SetRoundState caller - lazy lambda, invocation-time resolution
    added: 2026-08-06
    revised: ""

  - purpose: foundation_service_config_asset_loading
    status: active
    api: "When a Foundation static service needs a config ScriptableObject (e.g. a central content registry), load it via Addressables (LoadAssetAsync + WaitForCompletion for a synchronous, one-time load), lazily on first real gameplay use — never in the service's constructor/ResetOnLoad. Established by AnlatiDurumIpucuTakibi's ClueRegistry load (EnsureRegistryLoaded(), called from the first real OnShiftStateChanged(Held) handler invocation)."
    not: "Resources.Load (deprecated per deprecated-apis.md, Addressables is the documented replacement); loading eagerly in the constructor/ResetOnLoad (untested at FoundationBootstrap.ResetAll()'s ultra-early SubsystemRegistration timing — no prior Foundation service constructor had called any engine asset-loading API from that code path before this ADR)"
    adr: docs/architecture/adr-0007-clue-tracking-architecture.md
    reason: "This project's first real Addressables consumer — matches current-best-practices.md's documented Addressables-over-Resources preference while sidestepping the SubsystemRegistration-timing uncertainty entirely by deferring the load past boot, to a point where the engine/Addressables system is certainly fully initialized (real gameplay having occurred)."
    referenced_by:
      - docs/architecture/adr-0007-clue-tracking-architecture.md
    added: 2026-08-06
    revised: ""

  - purpose: scene_transition_execution_context
    status: active
    api: "Seviye/Sahne Geçişi (SceneTransitionManager) is a MonoBehaviour on a single GameObject in a new persistent 'Foundation' scene, loaded additively once at boot (same mechanism/timing family as ADR-0002's 'UI' scene and ADR-0003's 'Player' scene), never unloaded. Its one genuine timed requirement (0.5-2s deferred scene unload after Complete) uses an ordinary Coroutine (WaitForSeconds), not Awaitable or Task.Delay."
    not: "The ADR-0001 plain-static-service pattern (this is the one documented exception — see ADR-0001's own inline correction note); Awaitable.WaitForSecondsAsync (undocumented in this project's engine-reference, unverified); System.Threading.Tasks.Task.Delay (not Unity-native, disconnects from Time.timeScale/Play-mode-stop semantics)"
    adr: docs/architecture/adr-0008-scene-transition-state-machine.md
    reason: "First Foundation system needing both SceneManager's async load-completion callbacks AND a genuine timed delay unrelated to any external event — Coroutine is this project's most-proven async mechanism (Işık/Volume's per-zone ticker, ADR-0005) for a system whose zero-frame-swap/zero-black-frame guarantees are its most safety-critical requirements; minimizing mechanism risk was judged more valuable than static-service pattern purity."
    referenced_by:
      - docs/architecture/adr-0008-scene-transition-state-machine.md
      - docs/architecture/adr-0012-dialogue-callback-selection-timing.md   # consumes OnTransitionStateChanged for deferred callback-selection timing
    added: 2026-08-06
    revised: ""

  - purpose: adaptif_ses_execution_context
    status: active
    api: "Adaptif Ses Sistemi's playback side (AdaptifSesController) is a MonoBehaviour reusing ADR-0008's persistent 'Foundation' scene — the second such system, not a new host scene (see scene_transition_execution_context above). Its state slice (AdaptifSesSistemi, HeldSessionAlreadyPlayed) stays a plain ADR-0001 static facade with zero subscriptions. All subscriptions (to Işık/Volume's OnShiftStateChanged and SceneTransitionManager's OnTransitionStateChanged) happen in AdaptifSesController.Start(), never in any FoundationBootstrap.ResetAll()-time constructor."
    not: "The static facade itself subscribing to anything (ADR-0001's original, incorrect assumption for this system — corrected by ADR-0009); a third/fourth persistent scene for this controller (reuses ADR-0008's 'Foundation' scene instead)"
    adr: docs/architecture/adr-0009-audio-architecture.md
    reason: "Establishes the general shape for any future Foundation system that is a genuine state+MonoBehaviour hybrid: pure-state static facade (ADR-0001 pattern) for anything that must survive scene loads and be test-substitutable, paired with a MonoBehaviour (reusing the 'Foundation' persistent scene, not a new one) for anything requiring real Unity objects/subscriptions/timed behavior — subscriptions always at Start()-time, never constructor-time, satisfying the constructor_time_subscription_to_scenetransitionmanager forbidden pattern by construction."
    referenced_by:
      - docs/architecture/adr-0009-audio-architecture.md
    added: 2026-08-07
    revised: ""

  - purpose: interaction_focus_detection_layer_mask
    status: active
    api: "Etkileşim Sistemi's focus-detection SphereCast (InteractionController.ResolveFocusTarget) checks a combined LayerMask — a dedicated \"Interactable\" layer OR'd with a general \"Environment\" layer (walls/doors/other solid non-interactable geometry, including visually-transparent-but-physically-solid surfaces). The closest hit of either layer wins (ties broken by collider.GetInstanceID()); if the closest hit is not an IInteractable, the cast is treated as fully occluded, even if a real IInteractable exists further along the ray."
    not: "SphereCast against the Interactable layer alone (rejected — see ADR-0010 Alternative 1: physically implausible, lets the player interact through solid geometry)"
    adr: docs/architecture/adr-0010-interaction-state-machine.md
    reason: "Resolves etkilesim-sistemi.md's Open Question #2; matches Pillar 3 (Görev Gerçekliği)'s reachability expectations and the GDD's own glass-occlusion example — visual transparency is irrelevant, only collider presence on either layer matters. User-confirmed via AskUserQuestion, 2026-08-07."
    referenced_by:
      - docs/architecture/adr-0010-interaction-state-machine.md
    added: 2026-08-07
    revised: ""

  - purpose: dialogue_callback_selection_deferred_evaluation
    status: active
    api: "Diyalog/Anlatı İçeriği's DialogueSceneController subscribes to SceneTransitionManager.Instance.OnTransitionStateChanged in OnEnable() and evaluates callback selection only on the TransitionState.Complete event where gameObject.scene == SceneManager.GetActiveScene() — i.e. the Complete that actually made THIS scene active, not merely the first Complete received after subscribing."
    not: "Evaluating in Awake()/Start() directly (reproduces the GDD's saturation-timing bug — rejected by the GDD itself); a one-frame-delayed coroutine with no SceneTransitionManager reference (doesn't verify the swap actually completed); filtering OnTransitionStateChanged by event-arrival-order alone without the gameObject.scene identity check (unsound once PreloadHardCut is in play — see the broadcast_transition_event_consumed_without_identity_filter forbidden pattern this ADR's own bug generalizes into)"
    adr: docs/architecture/adr-0012-dialogue-callback-selection-timing.md
    reason: "Resolves the GDD's own critical (2026-08-04) requirement that scene-entry logic must be deferred past Awake/Start to genuine scene-active time, reusing ADR-0008's existing OnTransitionStateChanged event (already established for this exact 'wait for the swap to genuinely happen' need by ADR-0009) rather than inventing a new scene-activation signal. The gameObject.scene identity check was added after an initial draft's event-ordering-only reasoning was found unsound for the PreloadHardCut path during unity-specialist review."
    referenced_by:
      - docs/architecture/adr-0012-dialogue-callback-selection-timing.md
    added: 2026-08-07
    revised: ""

  - purpose: elevator_execution_context
    status: active
    api: "Asansör/Kat-Erişim Sistemi is per-floor: each floor scene carries its own visually-identical cabin prefab (ElevatorController + ElevatorTriggerZoneRelay children), with the logical single-cabin ride state shared cross-scene via the ElevatorSystem static facade (ADR-0001 pattern, in-place reset). The floor controller whose scene name equals ElevatorSystem.Instance.ActiveFloorScene is the sole Tick() driver; _thisFloorSceneName is derived from gameObject.scene.name, never hand-authored."
    not: "A single shared cabin GameObject in a new persistent 'Elevator' scene (rejected — no genuine always-loaded-object need, and it would depend on the unresolved RenderGraph/multi-scene camera-stacking spike from seviye-sahne-gecisi.md Open Question #2); an IInteractable call button (GDD's own explicit rejection — direct trigger-zone + Interact read, no crosshair/prompt); a MonoBehaviour-embedded state machine (violates coding-standards.md's test rule AND cannot be shared across two per-floor controller instances)"
    adr: docs/architecture/adr-0011-elevator-state-machine.md
    reason: "Resolves asansor-kat-erisim-sistemi.md's Open Question #1 (cabin architecture), whose owner the GDD itself named as 'technical-director, via an ADR.' Per-floor prefabs + shared facade satisfy the cross-scene busy-lockout requirement (GDD AC12) without a fifth persistent scene or the unverified camera-stacking dependency. User-confirmed via AskUserQuestion, 2026-08-07."
    referenced_by:
      - docs/architecture/adr-0011-elevator-state-machine.md
    added: 2026-08-07
    revised: ""

  - purpose: scene_object_state_restore_timing
    status: active
    api: "A scene object restoring already-set state from a static service on scene (re)load (a delivered CarryItemPickup, a Committed MemoryTriggerObject) performs the restore query at the TOP of its own OnEnable(), before the InteractableRegistry.Register call in the same method body. Two outcome variants, both on record: deactivate-entirely (SetActive(false) + return before Register — CarryItemPickup, ADR-0013) or stay-visible-skip-Register (object remains rendered scenery, simply never registers — MemoryTriggerObject, ADR-0014; revised 2026-08-08, the original wording mandated SetActive(false) for all cases). Deregister of a never-registered object is a safe no-op (ADR-0004)."
    not: "Querying in Awake() (the original TR-ani-tetik-002/TR-gorev-005 spec, superseded): under the Editor's 'Reload Scene: Off' Enter Play Mode Setting, Awake() does not re-run on surviving scene objects across a Play Stop-Play boundary while FoundationBootstrap.ResetAll() DOES clear the restore-source state - an Awake-only query silently skips the re-check (architecture.md QQ-07, forwarded by ADR-0001, closed by ADR-0013)"
    adr: docs/architecture/adr-0013-carry-loop-and-round-state.md
    reason: "OnEnable re-fires in exactly the scenario Awake misses, and the 'before registration' guarantee is preserved within the same OnEnable body - the fix ADR-0001's Risks section anticipated. The ADR-0014 adoption mandate is DISCHARGED (2026-08-08): MemoryTriggerObject adopted the stay-visible variant and both GDD/quick-spec Awake() wordings are synced."
    referenced_by:
      - docs/architecture/adr-0013-carry-loop-and-round-state.md
      - docs/architecture/adr-0014-memory-trigger-orchestration.md   # second adopter, stay-visible variant
    added: 2026-08-08
    revised: "2026-08-08 — ADR-0014: api wording extended to cover both restore variants (old wording mandated SetActive(false) universally)"

  - purpose: end_condition_execution_context
    status: active
    api: "Sahne Kesmeli Anlatı follows the ADR-0009 hybrid shape's second application: pure C# EndConditionStateMachine (all gate/deferral/priority logic, delegate-injected facts, BLOCKING-testable) inside a minimal SahneKesmeliAnlati static facade (in-place reset; NightBeginPending per-session flag), driven by SahneKesmeliAnlatiController in the persistent Foundation scene. Subscriptions are OnEnable/OnDisable-SYMMETRIC (a recorded deviation from adaptif_ses_execution_context's 'subscriptions at Start()' letter: Start()-time subscribe paired with OnDisable-unsubscribe is a session-2 dead zone under Reload Scene: Off, since OnDisable fires at session exit but Start() never re-runs — OnEnable re-fires, restoring delivery; night-begin setup stays in Start() because SceneTransitionManager.Instance is not guaranteed during the OnEnable pass). The controller is ALSO the night-begin orchestrator (the ADR-0013/0014-owed caller): SetTotalConfiguredTriggerCountForNight + StartNight from NightConfigDef, THEN the initial level-scene load. MINIMAL BOOT CONTRACT: the build's initial load set contains ONLY the persistent scenes (UI/Player/Foundation); the first level scene loads exclusively via this controller's post-setup call — the structural guarantee behind ADR-0013's setup-before-depot-activation constraint. Initial player placement: depot-authored InitialSpawnAnchor applied in the boot load's onComplete."
    not: "Polling the end conditions in Update() (the quick spec's own N5 finding rejected implicit polling); a plain static service with constructor-time subscriptions (banned pathways + no home for the serialized NightConfigDef); a separate NightBootstrapper component (same config + same ordering contract split across two components for zero behavioral difference)"
    adr: docs/architecture/adr-0015-end-condition-orchestration.md
    reason: "Closes the Required ADRs list (15/15). The OnEnable/OnDisable symmetry was user-confirmed after TD-ADR review caught the Start()/OnDisable asymmetry as a real lifecycle defect; the boot contract satisfies two prior ADRs' binding constraint structurally rather than by convention."
    referenced_by:
      - docs/architecture/adr-0015-end-condition-orchestration.md
    added: 2026-08-08
    revised: ""

