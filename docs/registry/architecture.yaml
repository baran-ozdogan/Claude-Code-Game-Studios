# ─── STATE OWNERSHIP ─────────────────────────────────────────────────────────
# Who is the authoritative owner of each piece of shared game state.
# Conflicts: two ADRs claiming to own the same state = data race / authority bug.
#
# Register state when it is READ or WRITTEN by more than one system.
# Internal-only state (never accessed by another system) does not need to be registered.
#
# Required fields: state, owner_system, adr, interface, referenced_by[], added
# interface: how other systems access this state (read-only property, method call,
#   signal, shared resource, etc.) — this is the contract other ADRs depend on.

state_ownership:
  - state: player_state
    status: active
    owner_system: player-state-provider
    adr: docs/architecture/adr-0003-player-state-and-movement-lock.md
    interface: "IPlayerState (EyeCamera, Velocity, IsGrounded, MovementLocked, IsCarrying, IsLocked, MovementLockChanged event), accessed via PlayerStateProvider.Current static accessor; movement lock via RequestMovementLock(requester, scope)/ReleaseMovementLock(requester)"
    write_access: "EyeCamera/Velocity/IsGrounded/IsCarrying written only by FirstPersonController (internal set); movement lock holders written only via Request/Release by the calling system. IsCarrying's mirror mechanism defined by ADR-0013: CarrySlotRigController (same Player GameObject) translates GorevTasimaDongusu's OnCarryingStarted/Ended events into sibling FirstPersonController.SetCarrying(bool) calls - external systems never touch the setter directly"
    referenced_by:
      - docs/architecture/adr-0003-player-state-and-movement-lock.md
      - docs/architecture/adr-0013-carry-loop-and-round-state.md   # defines the IsCarrying mirror mechanism
    added: 2026-08-05
    revised: ""

  - state: interactable_registry
    status: active
    owner_system: interactableregistry
    adr: docs/architecture/adr-0004-interactableregistry-foundation-ownership.md
    interface: "InteractableRegistry.Register(IInteractable)/Deregister(IInteractable) (called only from OnEnable/OnDisable), InteractableRegistry.Snapshot() (frame-start read-only cache, IReadOnlyList<IInteractable>)"
    write_access: "any IInteractable implementer, via OnEnable/OnDisable only — never ad hoc"
    referenced_by:
      - docs/architecture/adr-0004-interactableregistry-foundation-ownership.md
    added: 2026-08-05
    revised: ""

  - state: gece_oturum_durumu_session_state
    status: active
    owner_system: geceoturumdurumu
    adr: docs/architecture/adr-0006-session-state-service-and-round-counter-ownership.md
    interface: "IGeceOturumDurumuState (IsSessionActive, CurrentNightNumber, HasFired(id)/HasSettled(id)/IsPersistent(id), FiredCount/SettledCount, CurrentRoundIndex/TotalRoundCount, TotalConfiguredTriggerCountForNight, EndSession()), accessed via GeceOturumDurumu.Instance static accessor; internal write paths via GeceOturumDurumu.InternalInstance: SetRoundState(idx,total), SetTotalConfiguredTriggerCountForNight(count), AddFiredTrigger(shiftId)"
    write_access: "PersistentShiftIds (Shifting-In) and SettledTriggerIds (Held, gated on FiredTriggerIds membership) written via this service's own subscription to Işık/Volume's OnShiftStateChanged; FiredTriggerIds written DIRECTLY by Anı-Tetikleyici Etkileşim's OnHoldComplete() via AddFiredTrigger (idempotent, fires OnTriggerFired on first add) — the quick spec's locked model, NOT the subscription (corrected by ADR-0014: the previous line over-generalized 'written only via subscription' to all three sets, the likely seed being ADR-0006's own lumped Requirements wording, also fixed); CurrentRoundIndex/TotalRoundCount written only by Görev/Taşıma Döngüsü via SetRoundState(); TotalConfiguredTriggerCountForNight written once at night begin by the night-begin orchestrator (ADR-0015-owed caller), build-verified against the MemoryTriggerDef asset count; EndSession() convention-restricted to Sahne Kesmeli Anlatı (all single-caller rules convention-enforced, not compiler-checked — QQ-03)"
    referenced_by:
      - docs/architecture/adr-0006-session-state-service-and-round-counter-ownership.md
      - docs/architecture/adr-0014-memory-trigger-orchestration.md   # adds the field + two internal writers; corrected the Fired writer attribution
      - docs/architecture/adr-0015-end-condition-orchestration.md   # in-place reset conversion; OnTriggerFired/OnTriggerSettled persistent consumer
    added: 2026-08-06
    revised: "2026-08-08 — ADR-0014: +TotalConfiguredTriggerCountForNight, +SetTotalConfiguredTriggerCountForNight/AddFiredTrigger; Fired writer corrected from 'subscription-only' (old value preserved in write_access comment above) to the quick spec's direct-write model"

  - state: anlati_durum_ipucu_takibi_state
    status: active
    owner_system: anlatidurumipucutakibi
    adr: docs/architecture/adr-0007-clue-tracking-architecture.md
    interface: "IAnlatiDurumState (IsClueKnown(id), GetKnownClueIds(), MarkClueKnown(id), OnClueKnown event), accessed via AnlatiDurumIpucuTakibi.Instance static accessor"
    write_access: "MarkClueKnown() is deliberately public/unrestricted — GDD explicitly allows non-shift callers (e.g. a future dialogue choice) to mark a clue known directly, bypassing the shift-requirement path; internal _seenShiftIds is written only via this service's own subscription to Işık/Volume's OnShiftStateChanged (Held only)"
    referenced_by:
      - docs/architecture/adr-0007-clue-tracking-architecture.md
      - docs/architecture/adr-0015-end-condition-orchestration.md   # in-place reset conversion (regime decision)
    added: 2026-08-06
    revised: ""

  - state: adaptif_ses_sistemi_state
    status: active
    owner_system: adaptifsessistemi
    adr: docs/architecture/adr-0009-audio-architecture.md
    interface: "IAdaptifSesState (HasAlreadyPlayed(shiftId)), accessed via AdaptifSesSistemi.Instance static accessor — pure state, no subscriptions, no upstream Foundation dependency (corrects ADR-0001's original assumption, see ADR-0009 Decision)"
    write_access: "MarkPlayed(shiftId)/ClearPlayed(shiftId) are internal, reached only via AdaptifSesSistemi.InternalInstance by AdaptifSesController — a MonoBehaviour, not another static service; this is the pattern's first consumer whose sole writer is a MonoBehaviour rather than the state's own constructor-subscribed handler"
    referenced_by:
      - docs/architecture/adr-0009-audio-architecture.md
    added: 2026-08-07
    revised: ""

  - state: diyalog_anlati_icerigi_used_callback_ids
    status: active
    owner_system: diyaloganlatiicerigi
    adr: docs/architecture/adr-0012-dialogue-callback-selection-timing.md
    interface: "IDiyalogAnlatiIcerigiState (IsCallbackUsed(callbackId), GetUsedCallbackIds()), accessed via DiyalogAnlatiIcerigi.Instance static accessor — this pattern's first Core-layer (not Foundation-layer) consumer"
    write_access: "MarkCallbackUsed(callbackId) is internal, reached only via DiyalogAnlatiIcerigi.InternalInstance by DialogueSceneController — a MonoBehaviour, not another static service, mirroring AdaptifSesSistemi/AdaptifSesController's (ADR-0009) write shape"
    referenced_by:
      - docs/architecture/adr-0012-dialogue-callback-selection-timing.md
    added: 2026-08-07
    revised: ""

  - state: elevator_system_ride_state
    status: active
    owner_system: asansorkaterisimsistemi
    adr: docs/architecture/adr-0011-elevator-state-machine.md
    interface: "IElevatorSystemState (CurrentState, ActiveFloorScene, OriginScene, DestinationScene, TryCall(floorScene, isSessionActive), OnDoorsOpeningStarted/OnDoorsOpen/OnDoorsClosingStarted/OnIdleReached/OnReadyForTransition events), accessed via ElevatorSystem.Instance static accessor. ActiveFloorScene is the SINGLE authority for which floor's ElevatorController currently ticks the shared state machine — reassigned exactly once per ride, at OnTransitionComplete(). No automatic return ride: the arrival-side DoorsClosing always winds down to Idle regardless of playerInCabin (user decision, ADR-0011 TD-ADR review) — every ride begins with an explicit TryCall."
    write_access: "Tick/SetTransition/EnterWaiting/RejectedSynchronously/OnTransitionComplete/OnTransitionFailed are internal, reached only via ElevatorSystem.InternalInstance by whichever ElevatorController's floor equals ActiveFloorScene — two different per-floor MonoBehaviour instances share write responsibility over a ride's lifetime, the pattern's first multi-writer-handoff consumer"
    referenced_by:
      - docs/architecture/adr-0011-elevator-state-machine.md
    added: 2026-08-07
    revised: ""

  - state: gorev_tasima_dongusu_carry_state
    status: active
    owner_system: gorevtasimadongusu
    adr: docs/architecture/adr-0013-carry-loop-and-round-state.md
    interface: "IGorevTasimaState (CurrentState, CarriedCount, AreSlotsFull, IsFinalRoundActive, HasCarriedInFinalRound, IsFocusable(itemId, roundIdx, sessionActive), OnCarryingStarted/OnCarryingEnded/OnRoundActivated/OnFinalRoundStarted/OnFinalRoundItemPickedUp/OnTaskListCompleted events), accessed via GorevTasimaDongusu.Instance static accessor - the ADR-0001 pattern's FIRST Feature-layer consumer. Round counters are NOT re-exposed here - Adaptif Ses reads them from GeceOturumDurumu (ADR-0006). HARD ordering constraint (binding on ADR-0015/boot): StartNight() must complete before the depot scene's objects first activate, else round-0 items permanently self-deactivate."
    write_access: "TryPickUp/DeliverAll/StartNight are internal, reached only via GorevTasimaDongusu.InternalInstance by CarryItemPickup/DropOffZone (scene MonoBehaviours). The IsCarrying mirror: CarrySlotRigController (persistent Player GameObject) subscribes to OnCarryingStarted/Ended and calls its sibling FirstPersonController.SetCarrying - the PlayerStateProvider write stays physically inside the Player object, honoring player_state's 'written only by FirstPersonController' framing. CurrentRoundIndex/TotalRoundCount written only via GeceOturumDurumu.InternalInstance.SetRoundState, resolved lazily at invocation time (never constructor-captured)."
    referenced_by:
      - docs/architecture/adr-0013-carry-loop-and-round-state.md
    added: 2026-08-08
    revised: ""

