# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: assuming_static_batching_across_additive_scenes
    status: active
    description: "Do not assume Unity's static batching merges draw calls across additively loaded
      scenes. It does not — batching is per-scene."
    why: "This project's ~2000 draw-call budget (technical-preferences.md) is a project-wide assumption;
      under the additive scene-transition architecture (ADR-0001), draw calls must be planned per-scene,
      not against a combined-batching total, or the budget will be silently overrun during the 0.5-2s
      window when two scenes are simultaneously resident."
    adr: docs/architecture/adr-0001-scene-transition-manager.md
    added: 2026-08-05

