# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: independent_runtimeinitializeonload_per_session_service
    status: active
    description: "A session-scoped-state service must not attribute its own [RuntimeInitializeOnLoadMethod] reset method. All resets are centralized in FoundationBootstrap.ResetAll(), called in explicit Foundation dependency order."
    why: "Unity does not guarantee relative execution order between independent RuntimeInitializeOnLoadMethod callbacks at the same load stage — an unlucky order could reset a service before another service that subscribes to its events in its own constructor, silently dropping that subscription for the session. Confirmed as a live bug in ADR-0001's original draft during TD-ADR review, not just a theoretical risk."
    adr: docs/architecture/adr-0001-in-memory-static-service-pattern.md
    added: 2026-08-05

  - pattern: dont_destroy_on_load_singleton_for_session_state
    status: active
    description: "Session-scoped state (facts that must survive a scene load within one play session) must not be implemented as a DontDestroyOnLoad singleton MonoBehaviour."
    why: "No GameObject/Transform/component lifecycle is needed for pure state/event data; carries real overhead, risks duplicate-instance bugs across additive scene loads, and doesn't independently solve the Domain Reload or testability/DI requirements this project's coding-standards.md requires."
    adr: docs/architecture/adr-0001-in-memory-static-service-pattern.md
    added: 2026-08-05

  - pattern: caching_session_state_interface_reference_across_session_boundary
    status: active
    description: "Consumers must always read a session-scoped-state service's static facade (e.g. GeceOturumDurumu.Instance) live at the point of use, never cache the returned interface reference in a field across a Play-mode session boundary."
    why: "A cached reference can point to an orphaned pre-reset instance after FoundationBootstrap.ResetAll() runs, silently missing all events from the canonical new instance — especially risky combined with Reload Scene disabled, where Awake() doesn't re-run. SCOPE NARROWED (ADR-0015, 2026-08-08): this hazard exists only for REPLACEMENT-reset facades. Under the in-place regime (all event-involved facades since ADR-0015) the backing instance is never replaced, so no orphaned instance can exist — caching a reference to a structurally never-replaced instance is safe and is done deliberately (e.g. ADR-0015's controller caching its machine, with an inline citation of this pattern). The rule remains binding for any facade not documented as never-replaced."
    adr: docs/architecture/adr-0001-in-memory-static-service-pattern.md
    added: 2026-08-05
    revised: "2026-08-08 - ADR-0015: scope narrowed to replacement-reset facades; never-replaced-instance carve-out recorded" 

  - pattern: ugui_canvas_usage
    status: active
    description: "No UGUI (Canvas, Image, TextMeshProUGUI, etc.) component anywhere in the project, including any future menu/settings/pause screen. UI Toolkit is the exclusive UI framework."
    why: "Avoids two parallel UI stacks for what is (and is expected to remain) a small UI surface; matches Unity 6's own current-best-practice recommendation for new projects with zero countervailing cost on a greenfield codebase with no existing UGUI investment."
    adr: docs/architecture/adr-0002-ui-framework-ui-toolkit.md
    added: 2026-08-05

  - pattern: interactable_in_persistent_scene
    status: active
    description: "IInteractable implementers must not live in a persistent, never-unloaded scene (the pattern ADR-0002/ADR-0003 use for UI/Player)."
    why: "InteractableRegistry's live list is self-correcting only because every IInteractable's OnDisable fires when its scene is torn down at session end — an interactable in a persistent scene would never deregister, silently breaking that assumption and leaking stale entries indefinitely."
    adr: docs/architecture/adr-0004-interactableregistry-foundation-ownership.md
    added: 2026-08-05

  - pattern: session_surviving_cache_keyed_on_native_engine_counter
    status: active
    description: "A cache or invalidation check keyed on a native Unity counter that resets every Play session (Time.frameCount, Time.time, etc.) must not be left as a plain static field with no reset hook — it must register a minimal ResetOnLoad() in FoundationBootstrap.ResetAll() (ADR-0001), even if the underlying data it caches is itself self-correcting and needs no reset of its own."
    why: "With Domain Reload disabled, such a field survives across Play sessions while the native counter it's compared against resets to near-zero — if a later session's counter value collides with the stale cached value, the cache is incorrectly treated as still valid and returns stale (possibly destroyed-object-referencing) data. Discovered as a live, not theoretical, bug in InteractableRegistry's frame-snapshot cache during ADR-0004's engine-specialist validation."
    adr: docs/architecture/adr-0004-interactableregistry-foundation-ownership.md
    added: 2026-08-05

  - pattern: overlapping_shift_zone_volume_boxes
    status: active
    description: "Two ShiftZones' Volume-trigger box Bounds must not overlap in the same scene, even if they share zero lights. Minimum zone-center spacing is BoxHalfExtentMin_A + BoxHalfExtentMin_B (~20-40m per the GDD's own worked examples)."
    why: "All ShiftZones share one VolumeProfile asset. If two zones' boxes overlap, both Volumes can be simultaneously weighted, and URP composites multiple weighted local Volumes referencing the same profile as sequential over-Lerp, not averaging — non-linear, screen-wide grade amplification invisible to a designer reviewing only light assignments. Reachable even with correctly-non-shared lights because the Box Collider Safety Margin formula deliberately oversizes the trigger box well beyond the light-affected radius. Discovered during ADR-0005's engine-specialist validation; the prototype spike only tested a single isolated zone."
    adr: docs/architecture/adr-0005-isik-volume-rendering-architecture.md
    added: 2026-08-05

  - pattern: constructor_subscribing_foundation_service_reset_before_event_source
    status: active
    description: "In FoundationBootstrap.ResetAll() (ADR-0001), a Foundation service that subscribes to another Foundation service's event inside its own constructor/static field initializer must never be ordered before that event source's own ResetOnLoad() call."
    why: "Generalizes a live bug found and fixed in ADR-0001's original ResetAll() ordering (ADR-0006, 2026-08-06): Gece/Oturum Durumu's constructor subscription to Işık/Volume's event bound to a stale, about-to-be-replaced instance when reset first. HAZARD GEOMETRY REVISED (ADR-0015, 2026-08-08): under the in-place regime, constructor subscriptions bind once per process to never-replaced instances and survive every reset — the original stale-binding hazard is unreachable for all current services, and ResetAll() ordering is data-only. The LIVE residual hazard is the mirror image: a future REPLACEMENT-reset facade constructor-subscribing to an in-place event source would re-subscribe on every reset (per-session accumulation, handler firing N+1 times after N resets) AND leave each discarded instance's handler permanently pinned. Any future facade added to ResetAll() must therefore either be in-place itself or must not constructor-subscribe to in-place sources."
    adr: docs/architecture/adr-0006-session-state-service-and-round-counter-ownership.md
    added: 2026-08-06
    revised: "2026-08-08 - ADR-0015: hazard geometry updated for the in-place regime (old stale-binding form unreachable; accumulation form is the live residual)" 

  - pattern: engine_asset_api_call_in_foundation_constructor
    status: active
    description: "A Foundation static service's constructor or ResetOnLoad() must never directly call an engine asset-loading API (Addressables, Resources, AssetDatabase, or any other synchronous/async asset resolution call). Any such load must be deferred to first real gameplay use instead."
    why: "FoundationBootstrap.ResetAll() (ADR-0001) fires via [RuntimeInitializeOnLoadMethod(SubsystemRegistration)] — the earliest point in Unity's boot sequence, before general engine/subsystem readiness (including Addressables' own initialization) is guaranteed. Discovered during ADR-0007's authoring: the first draft loaded a config ScriptableObject (ClueRegistry) eagerly in a Foundation service's constructor, which would have been this project's first-ever engine-API call from that code path, with unverified timing safety. Fixed by deferring the load to the service's first real event-handler invocation (a point in the session guaranteed to be well past boot) — see foundation_service_config_asset_loading (api_decisions) for the resulting pattern."
    adr: docs/architecture/adr-0007-clue-tracking-architecture.md
    added: 2026-08-06

  - pattern: constructor_time_subscription_to_scenetransitionmanager
    status: active
    description: "No Foundation service may reference SceneTransitionManager.Instance (read a property, subscribe to OnTransitionStateChanged, call a method) from its own constructor or ResetOnLoad(). Any such usage must be deferred to first real gameplay use instead."
    why: "Seviye/Sahne Geçişi (ADR-0008) is the one Foundation service that is a MonoBehaviour in a persistent scene, not a plain static-facade class reset by FoundationBootstrap.ResetAll(). Its Instance is set by that scene's own Awake(), which runs well after FoundationBootstrap.ResetAll()'s SubsystemRegistration-time execution — so a plain-static-service constructor referencing SceneTransitionManager.Instance at that point would find it null, unlike every other Foundation service's Instance, which IS guaranteed constructed by the time ResetAll() returns. Discovered while drafting ADR-0008, load-bearing for the not-yet-written Audio Architecture ADR (#9), whose Adaptif Ses Sistemi must subscribe to OnTransitionStateChanged lazily because of this rule."
    adr: docs/architecture/adr-0008-scene-transition-state-machine.md
    added: 2026-08-06

  - pattern: broadcast_transition_event_consumed_without_identity_filter
    status: active
    description: "A consumer of SceneTransitionManager.OnTransitionStateChanged must never assume 'the first event received after subscribing' identifies its own transition. The event carries no scene/transition identity (TransitionState, TransitionType only) — a consumer must additionally check something that actually identifies the transition as its own (e.g. gameObject.scene == SceneManager.GetActiveScene() for a scene-local subscriber) before acting on a Complete event."
    why: "PreloadHardCut (ADR-0008) advances _hardCutPreloadState independently of CurrentState/OnTransitionStateChanged, so a scene can be fully loaded (Awake/OnEnable already run, subscription already active) while sitting inactive in the background, arbitrarily long before its real swap — during which unrelated SOFT transitions keep firing their own Complete events freely. Discovered as a live BLOCKING bug in ADR-0012's original draft (unity-specialist review, 2026-08-07): DialogueSceneController evaluated on the first unrelated elevator SOFT transition's Complete while the psychiatry scene sat PreloadHardCut'd in the background, reproducing the exact 'evaluated before the scene is genuinely active' bug the mechanism existed to prevent. Any future consumer of this event (not just Diyalog/Anlatı İçeriği) is equally exposed unless it applies an identity filter."
    adr: docs/architecture/adr-0012-dialogue-callback-selection-timing.md
    added: 2026-08-07

  - pattern: wholesale_state_replacement_for_event_exposing_facade
    status: active
    description: "An ADR-0001-pattern static facade whose interface exposes C# events (forwarded onto a backing instance's event fields) must reset via an in-place ResetOnLoad() that clears fields on the SAME backing instance — never by replacing the backing instance/field with a new object."
    why: "Facade events forward subscriptions directly onto the backing instance's own event fields (add/remove accessors). Replacing the instance on reset silently orphans every already-subscribed MonoBehaviour — subscriptions stay bound to the discarded old instance and never fire again, with no error. Reachable exactly in the 'Reload Scene: Off' scenario ADR-0001/0003/0008/0010 all document. Discovered during ADR-0011's unity-specialist review (ElevatorSystem's original reset). REVISED example clause (ADR-0015, 2026-08-08): the original text cited 'GeceOturumDurumu's original shape' as an events-free facade where replacement remains fine — inaccurate even at registration (IGeceOturumDurumuState has exposed OnTriggerFired/OnTriggerSettled since ADR-0001's worked example), and GeceOturumDurumu is now the flagship in-place conversion. Post-ADR-0015, ALL event-involved facades (exposing events OR constructor-subscribing to another facade's events) reset in place; a truly event-free pure-state facade (e.g. AdaptifSesSistemi, DiyalogAnlatiIcerigi... which also resets in place by ADR-0012's choice) MAY use replacement, but in-place is the project default."
    adr: docs/architecture/adr-0011-elevator-state-machine.md
    added: 2026-08-07
    revised: "2026-08-08 - ADR-0015: example clause corrected (old value preserved in why text); all-facades in-place regime recorded" 

