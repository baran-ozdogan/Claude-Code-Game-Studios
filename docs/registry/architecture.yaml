# Architecture Decision Registry
#
# PURPOSE: Single source of truth for key architectural stances that all ADRs
# must agree on. Skills check this before writing new ADRs to detect conflicts
# at authoring time — before stories are created against contradictory decisions.
#
# RULES:
#   - Register a stance when it constrains how OTHER systems must be built.
#     An internal implementation detail that affects only one ADR does not need
#     to be registered.
#   - Never delete entries — set status: superseded_by: ADR-NNNN instead.
#   - When a stance changes: update the entry, set revised: to today's date,
#     add a comment with the old value, and run /architecture-review to check
#     what ADRs are now invalidated.
#   - adr: is the authoritative source. All other ADRs that depend on this
#     stance list themselves in referenced_by.
#
# WRITTEN BY: /architecture-decision (Phase 5 — after ADR is approved)
# READ BY:    /architecture-decision (Step 2 — before authoring begins)
#             /architecture-review (Phase 4 — cross-ADR conflict baseline)
#             /create-stories (to embed architectural constraints in stories)
#             /dev-story (to check implementation against accepted stances)
#
# SEARCH PATTERNS (for skills using Grep):
#   All state owners:       Grep pattern="^  - state:" path="docs/registry/architecture.yaml"
#   Who owns player_health: Grep pattern="state: player_health"
#   All signal contracts:   Grep pattern="pattern: signal"
#   Budget for combat:      Grep pattern="system: combat"
#   All forbidden patterns: Grep pattern="^  - pattern:" (forbidden_patterns section)
#   Superseded entries:     Grep pattern="status: superseded"

version: 2
last_updated: "2026-08-05"

# ─── STATE OWNERSHIP ─────────────────────────────────────────────────────────
# Who is the authoritative owner of each piece of shared game state.
# Conflicts: two ADRs claiming to own the same state = data race / authority bug.
#
# Register state when it is READ or WRITTEN by more than one system.
# Internal-only state (never accessed by another system) does not need to be registered.
#
# Required fields: state, owner_system, adr, interface, referenced_by[], added
# interface: how other systems access this state (read-only property, method call,
#   signal, shared resource, etc.) — this is the contract other ADRs depend on.

state_ownership:
  - state: session_active_flag
    status: active
    owner_system: session-state
    adr: docs/architecture/adr-0003-session-state.md
    interface: "SessionState.IsSessionActive (read-only bool); write only via SessionState.EndSession(), idempotent no-op if already false"
    write_access: session-state-only
    referenced_by:
      - docs/architecture/adr-0003-session-state.md
    added: 2026-08-05
    revised: ""

  - state: memory_trigger_bookkeeping
    status: active
    owner_system: session-state
    adr: docs/architecture/adr-0003-session-state.md
    interface: "SessionState.FiredTriggerIds / SettledTriggerIds (IReadOnlySet<string>), PersistentShiftIds (IReadOnlyDictionary<string,bool>); FiredTriggerIds written only via RecordTriggerFired(shiftId) [idempotent, fires OnTriggerFired only on first add], SettledTriggerIds/PersistentShiftIds written only internally from the ILightingVolumeQuery.OnShiftStateChanged handler"
    write_access: session-state-only
    referenced_by:
      - docs/architecture/adr-0003-session-state.md
      - docs/architecture/adr-0005-lighting-volume-state.md   # reads PersistentShiftIds (read-only) at zone Awake() for Persistent-restore-on-scene-load
    added: 2026-08-05
    revised: "2026-08-05 (added lighting-volume as a reader, per ADR-0005 — read-only, no change to write_access)"

  - state: known_clue_state
    status: active
    owner_system: narrative-state
    adr: docs/architecture/adr-0004-narrative-state.md
    interface: "NarrativeState.GetKnownClueIds() (IReadOnlyCollection<string>), IsClueKnown(clueId) (read-only bool query); internal SeenShiftIds never exposed. Written only via MarkClueKnown(clueId) [idempotent, fires OnClueKnown only on Unknown→Known] or internally from the ILightingVolumeQuery.OnShiftStateChanged handler (Held-only)"
    write_access: narrative-state-only
    referenced_by:
      - docs/architecture/adr-0004-narrative-state.md
    added: 2026-08-05
    revised: ""

  - state: held_session_already_played
    status: active
    owner_system: adaptive-audio
    adr: docs/architecture/adr-0006-adaptive-audio.md
    interface: "AdaptiveAudioState internal HashSet<string> (not publicly exposed) — guards exactly-once-per-session stinger playback across both the Shifting-In-early and Held-normal trigger paths. No external read/write API; purely internal to this system's own state machine."
    write_access: adaptive-audio-only
    referenced_by:
      - docs/architecture/adr-0006-adaptive-audio.md
    added: 2026-08-05
    revised: ""

# Example:
#
# state_ownership:
#   - state: player_health
#     status: active           # active | superseded_by: ADR-NNNN
#     owner_system: health-system
#     adr: docs/architecture/adr-0001-health-system.md
