    status: active
    source: design/gdd/birinci-sahis-kontrolcu.md
    referenced_by:
      - design/gdd/birinci-sahis-kontrolcu.md
      - design/gdd/adaptif-ses-sistemi.md
    value: 1.6
    unit: m/s
    added: 2026-08-01
    revised: ""

  - name: walk_speed_carrying
    status: active
    source: design/gdd/birinci-sahis-kontrolcu.md
    referenced_by:
      - design/gdd/birinci-sahis-kontrolcu.md
      - design/gdd/gorev-tasima-dongusu.md
    value: 1.35
    unit: m/s
    added: 2026-08-01
    revised: ""

  - name: carry_multiplier
